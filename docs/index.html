<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="RentScope — geospatial rental opportunity analysis for Davis, California." />
  <title>RentScope · Davis rental map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="grid-lines"></div>
  </div>

  <div class="app">
    <header class="top-bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <span class="brand-mark-inner"></span>
        </span>
        <div>
          <h1>RentScope</h1>
          <p class="tagline">Spatial scoring for Davis rentals</p>
        </div>
      </div>
      <div class="header-meta">
        <span class="pill"><span class="pill-dot"></span> OpenStreetMap</span>
        <span class="pill">GeoJSON · Leaflet</span>
      </div>
    </header>

    <section class="summary" id="summary-cards" aria-live="polite">
      <article class="card metric">
        <h2>Listings</h2>
        <p class="value" id="metric-count">—</p>
      </article>
      <article class="card metric">
        <h2>Avg rent</h2>
        <p class="value" id="metric-avg-rent">—</p>
      </article>
      <article class="card metric">
        <h2>Best score</h2>
        <p class="value" id="metric-best">—</p>
      </article>
      <article class="card metric">
        <h2>Lowest rent</h2>
        <p class="value" id="metric-cheapest">—</p>
      </article>
    </section>

    <div class="main-grid">
      <aside class="sidebar panel">
        <h2 class="panel-title">Filters</h2>
        <div class="filters">
          <label class="field">
            <span>Max rent</span>
            <input type="number" id="filter-rent" min="0" step="50" placeholder="No limit" />
          </label>
          <label class="field">
            <span>Bedrooms</span>
            <select id="filter-beds">
              <option value="">Any</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4+</option>
            </select>
          </label>
          <label class="field">
            <span>Min score</span>
            <input type="number" id="filter-score" min="0" max="100" step="1" placeholder="0" />
          </label>
          <label class="field">
            <span>Property type</span>
            <select id="filter-type">
              <option value="">Any</option>
            </select>
          </label>
        </div>

        <h2 class="panel-title spaced">Top opportunities</h2>
        <p class="hint">Ranked by opportunity score (0–100)</p>
        <ol class="ranking" id="ranking-list"></ol>
      </aside>

      <section class="map-wrap panel">
        <div class="map-chrome" aria-hidden="true"></div>
        <div id="map" role="application" aria-label="Interactive map of rental listings"></div>
        <div class="legend">
          <span class="legend-title">Score</span>
          <div class="legend-bar" id="legend-bar"></div>
          <div class="legend-labels">
            <span>0</span>
            <span>50</span>
            <span>100</span>
          </div>
        </div>
      </section>
    </div>

    <footer class="footer">
      <p>© 2026 Anant Madhok · <a href="https://github.com/Anant-Madhok231/rent-scope">rent_scope</a> · MIT License</p>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="./app.js"></script>
</body>
</html>
